<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SQL ASSISTANT</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #1e1e1e;
      color: #f0f0f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .center-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 800px;
      width: 100%;
      text-align: center;
      padding: 0 20px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 600;
      background: linear-gradient(-45deg, #6a5acd, #e66465, #8a2be2, #e66465);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientMove 5s ease infinite;
      margin-bottom: 20px;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .subheading {
  font-size: 1.25rem;
  font-weight: 500;
  margin-top: -12px;
  margin-bottom: 28px;
  background: linear-gradient(-45deg, #f06292, #ba68c8, #9575cd);
  background-size: 400% 400%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: gradientMove 5s ease infinite;
}
.sql-icon {
  width: 80px;
  height: auto;
  margin-bottom: 16px;
}

@keyframes pulseIcon {
  0%, 100% {
    transform: scale(1);
    filter: drop-shadow(0 0 4px #ff80ab);
  }
  50% {
    transform: scale(1.05);
    filter: drop-shadow(0 0 10px #ff80ab);
  }
}

    .messages {
      max-height: 340px;
      overflow-y: auto;
      width: 100%;
      margin-top: 20px;
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .message {
      display: flex;
      gap: 6px;
      align-items: flex-start;
      padding: 12px 16px;
      margin: 8px 0;
      border-radius: 14px;
      max-width: 85%;
      color: white;
      font-size: 15px;
      line-height: 1.5;
      text-align: left;
      white-space: pre-wrap;
    }

    .user {
      background-color: #4a90e2;
      align-self: flex-end;
    }

    .bot {
      background-color: #2f2f2f;
      align-self: flex-start;
    }

    .code-block-wrapper {
      background: #1e1e1e;
      border-radius: 10px;
      margin-top: 8px;
      padding: 16px;
      overflow-x: auto;
    }

    pre code {
      background: transparent;
      color: #f8f8f2;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.6;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: #2c2c2c;
      border-radius: 999px;
      padding: 12px 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: 100%;
      max-width: 720px;
    }

    .input-wrapper input[type="text"] {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 15px;
      font-family: 'Poppins', sans-serif;
      padding: 8px;
    }

    .send-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 18px;
      padding: 6px;
      margin-left: 8px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .send-btn:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <div class="center-wrapper">
      <img src="images/icon1.png" alt="SQL Icon" class="sql-icon" />
<h2 class="subheading">SQL QUERY BUILDER & GENERATOR</h2>


      <div class="input-wrapper">
        <input type="text" id="mysqlInput" placeholder="Ask a MySQL query..." />
        <button class="send-btn" onclick="sendMySQL()">▶️</button>
      </div>

      <div class="messages" id="chatArea"></div>
    </div>
  </div>

  <script>
    const chatArea = document.getElementById("chatArea");
    const input = document.getElementById("mysqlInput");

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMySQL();
      }
    });

    async function sendMySQL() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";

      try {
        const res = await fetch("http://localhost:8000/sql", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: text })
        });

        const data = await res.json();
        renderBotMessage(data.response || "No response");
      } catch (err) {
        console.error(err);
        renderBotMessage("⚠️ Could not connect to backend.");
      }
    }

    function addMessage(msg, type) {
      const div = document.createElement("div");
      div.className = `message ${type}`;
      div.textContent = msg;
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function renderBotMessage(text) {
      const html = marked.parse(text);
      const wrapper = document.createElement("div");
      wrapper.className = "message bot";
      wrapper.innerHTML = html;

      wrapper.querySelectorAll('pre').forEach(pre => {
        const code = pre.querySelector('code');
        if (!code.className.includes('language-')) {
          code.className = 'language-sql';
        }
        const outer = document.createElement("div");
        outer.className = "code-block-wrapper";
        pre.replaceWith(outer);
        outer.appendChild(pre);
      });

      chatArea.appendChild(wrapper);
      chatArea.scrollTop = chatArea.scrollHeight;
      hljs.highlightAll();
    }
  </script>
</body>
</html>
